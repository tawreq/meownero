<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meownero PFP Studio</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17161a;background:#f7f6f3}*{box-sizing:border-box}body{margin:0}header{background:#17161a;color:white;padding:22px max(24px,calc((100vw - 1100px)/2));font-weight:900;font-size:23px}header b{color:#fa691d}main{max-width:1100px;margin:35px auto;padding:0 18px}h1{font-size:clamp(32px,5vw,56px);margin:0 0 6px}p{color:#59575a}main>p{margin-bottom:30px}.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr);gap:30px}.preview{position:sticky;top:20px;align-self:start}canvas#preview{width:100%;aspect-ratio:1;display:block;border:3px solid #17161a;border-radius:18px;box-shadow:8px 8px 0 #17161a;background:#fff}.controls{background:#fff;border:2px solid #17161a;border-radius:18px;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button{cursor:pointer;font:inherit;border:2px solid #17161a;border-radius:10px;padding:10px 12px;background:white;font-weight:700}button.active{background:#fa691d;color:#fff}button.primary{background:#fa691d;color:#fff;width:100%;margin-top:12px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{padding:5px;overflow:hidden;font-size:12px;display:flex;flex-direction:column;gap:5px}.tile img{width:100%;aspect-ratio:1;object-fit:contain;background:#eee;border-radius:6px}.swatch{height:65px;border-radius:6px;border:1px solid #ddd}.label{display:block;margin:14px 0 7px;font-weight:700}input[type=range]{width:100%}.note{font-size:12px}.actions{display:flex;gap:10px}.actions button{flex:1}#notice{font-size:13px}@media(max-width:750px){.studio{grid-template-columns:1fr}.preview{position:static}.controls{padding:13px}}</style></head><body><header>MEOW<b>NERO</b> <small> / PFP STUDIO</small></header><main><h1>MAKE IT YOUR MEOW.</h1><p>Choose a look. Switch the background. Add accessories. Download your PFP.</p><div class="studio"><div class="preview"><canvas id="preview" width="1000" height="1000"></canvas><div class="actions"><button id="random">🎲 Randomise</button><button id="reset">↺ Reset</button></div><button class="primary" id="download">↓ Download PNG · 1000 × 1000</button><p id="notice">26 Meownero looks. Pick your purr-sonality.</p></div><section class="controls"><div class="tabs" id="tabs"></div><div id="options" class="options"></div><div id="adjust"></div></section></div></main><script>
const c=document.querySelector('#preview'),ctx=c.getContext('2d');const outfits=[{"name":"Classic Ghost Cat","src":"/pfp/base%20image.png"},{"name":"Midnight Meow","src":"/pfp/meownero/jacket-01.png"},{"name":"Web Whisker Racer","src":"/pfp/meownero/jacket-02.png"},{"name":"Catwalk Caramel","src":"/pfp/meownero/jacket-03.png"},{"name":"Silver Tabby Track","src":"/pfp/meownero/jacket-04.png"},{"name":"Daisy Paws Noir","src":"/pfp/meownero/jacket-05.png"},{"name":"Cream of the Catwalk","src":"/pfp/meownero/jacket-06.png"},{"name":"Cocoa Catnip Bloom","src":"/pfp/meownero/jacket-07.png"},{"name":"Shadow Prowler","src":"/pfp/meownero/jacket-08.png"},{"name":"Stadium Stray","src":"/pfp/meownero/jacket-09.png"},{"name":"Caramel Curl","src":"/pfp/meownero/jacket-10.png"},{"name":"Midnight Quilted Purr","src":"/pfp/meownero/jacket-11.png"},{"name":"Scarlet Summit","src":"/pfp/meownero/jacket-12.png"},{"name":"Pit Stop Purr","src":"/pfp/meownero/jacket-13.png"},{"name":"Alleycat Racing","src":"/pfp/meownero/jacket-14.png"},{"name":"Woodland Whiskers","src":"/pfp/meownero/jacket-15.png"},{"name":"Sage Purrsity","src":"/pfp/meownero/jacket-16.png"},{"name":"Neon Night Prowler","src":"/pfp/meownero/jacket-17.png"},{"name":"Golden Nap","src":"/pfp/meownero/jacket-18.png"},{"name":"Cartoon Catwalk","src":"/pfp/meownero/jacket-19.png"},{"name":"Midnight Purrsity","src":"/pfp/meownero/jacket-20.png"},{"name":"Onyx Puff","src":"/pfp/meownero/jacket-21.png"},{"name":"Red Ridge Roamer","src":"/pfp/meownero/jacket-22.png"},{"name":"Denim Paws","src":"/pfp/meownero/jacket-23.png"},{"name":"Teal Tuxedo","src":"/pfp/meownero/jacket-24.png"},{"name":"Moonlight Monogram","src":"/pfp/meownero/jacket-25.png"},{"name":"Caramel Cloud","src":"/pfp/meownero/jacket-26.png"}];
const backgrounds=[{name:'Original cream',type:'cream'},{name:'Orange',type:'#fa691d'},{name:'Sky blue',type:'#9dc9e9'},{name:'Lilac',type:'#b5a2df'},{name:'Mint',type:'#b8e0c0'},{name:'Black',type:'#17161a'},{name:'Pink',type:'#f3b6c7'},{name:'Yellow',type:'#f8d970'},{name:'Dots',type:'dots'},{name:'Sunburst',type:'burst'}];
const accessories={Glasses:['None','Black shades','Pixel shades'],Hats:['None','Crown','Black cap'],Bling:['None','Gold chain','Silver chain']};const state={outfit:0,bg:0,Glasses:0,Hats:0,Bling:0,scale:1,x:0,y:0};let tab='Outfits';const images=new Array(outfits.length);
function loadOutfit(index){if(images[index])return images[index];const img=new Image();img.decoding='async';img.onload=()=>{if(state.outfit===index)draw()};img.onerror=()=>{if(state.outfit===index){document.querySelector('#notice').textContent='This outfit could not be loaded. Please try another.';draw()}};img.src=outfits[index].src;images[index]=img;return img}
loadOutfit(0);
function background(){const b=backgrounds[state.bg].type;ctx.fillStyle=b==='cream'||b==='dots'?'#f7f6f3':b==='burst'?'#fa691d':b;ctx.fillRect(0,0,1000,1000);if(b==='dots'||b==='cream'){ctx.fillStyle='rgba(23,22,26,.10)';for(let y=20;y<1000;y+=40)for(let x=20;x<1000;x+=40){ctx.beginPath();ctx.arc(x,y,2.3,0,7);ctx.fill()}}if(b==='burst'){ctx.save();ctx.translate(500,500);for(let i=0;i<24;i++){ctx.rotate(Math.PI/12);ctx.fillStyle=i%2?'#fa691d':'#ffb04a';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-100,-900);ctx.lineTo(100,-900);ctx.fill()}ctx.restore()}}
function accessory(){ctx.save();ctx.translate(state.x,state.y);ctx.scale(state.scale,state.scale);if(state.Bling){ctx.strokeStyle=state.Bling===1?'#edbd39':'#cbd3df';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(365,565);ctx.quadraticCurveTo(500,750,635,565);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(500,713,30,0,7);ctx.fill()}if(state.Glasses){ctx.fillStyle='#16161b';if(state.Glasses===1){for(let x of [345,520]){ctx.beginPath();ctx.roundRect(x,297,135,75,17);ctx.fill()}ctx.fillRect(470,310,60,12)}else{for(let x of [340,515])for(let y=298;y<360;y+=16)ctx.fillRect(x,y,135,13);ctx.fillRect(475,312,40,14)}}if(state.Hats){if(state.Hats===1){ctx.fillStyle='#e9b73a';ctx.strokeStyle='#a36a17';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(320,230);ctx.lineTo(320,90);ctx.lineTo(400,150);ctx.lineTo(500,65);ctx.lineTo(600,150);ctx.lineTo(680,90);ctx.lineTo(680,230);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#e33d34';ctx.beginPath();ctx.arc(500,100,18,0,7);ctx.fill()}else{ctx.fillStyle='#1c1b20';ctx.beginPath();ctx.ellipse(500,215,200,115,0,Math.PI,2*Math.PI);ctx.fill();ctx.fillRect(300,202,400,42);ctx.fillStyle='#fa691d';ctx.fillRect(300,239,400,14)}}ctx.restore()}
function draw(){background();const img=loadOutfit(state.outfit);if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,1000,1000);else if(state.outfit!==0){const base=loadOutfit(0);if(base.complete&&base.naturalWidth)ctx.drawImage(base,0,0,1000,1000)}accessory()}
function render(){const tabs=['Outfits','Backgrounds','Glasses','Hats','Bling'];document.querySelector('#tabs').replaceChildren(...tabs.map(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};return b}));const opts=document.querySelector('#options');opts.replaceChildren();let items=tab==='Outfits'?outfits:tab==='Backgrounds'?backgrounds:accessories[tab].map(name=>({name}));items.forEach((item,i)=>{const b=document.createElement('button');b.className='tile '+((tab==='Outfits'?state.outfit:tab==='Backgrounds'?state.bg:state[tab])===i?'active':'');if(tab==='Outfits'){const img=document.createElement('img');img.loading='lazy';img.decoding='async';img.alt=item.name;img.src=item.src;img.onerror=()=>{img.src='/ghost.webp';img.onerror=null};b.append(img)}else if(tab==='Backgrounds'){const sw=document.createElement('div');sw.className='swatch';sw.style.background=item.type==='cream'?'#f7f6f3':item.type==='dots'?'radial-gradient(#aaa 1px,#f7f6f3 1px)':item.type==='burst'?'repeating-conic-gradient(#ffb04a 0deg 15deg,#fa691d 15deg 30deg)':item.type;b.append(sw)}const label=document.createElement('span');label.textContent=item.name;b.append(label);b.onclick=()=>{if(tab==='Outfits')state.outfit=i;else if(tab==='Backgrounds')state.bg=i;else state[tab]=i;draw();render()};opts.append(b)});const adj=document.querySelector('#adjust');adj.replaceChildren();if(['Glasses','Hats','Bling'].includes(tab)){for(const [name,key,min,max,step] of [['Size','scale',.6,1.5,.01],['Horizontal','x',-130,130,1],['Vertical','y',-130,130,1]]){const l=document.createElement('label');l.className='label';l.textContent=name;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=state[key];input.oninput=()=>{state[key]=Number(input.value);draw()};adj.append(l,input)}}}
document.querySelector('#random').onclick=()=>{state.outfit=Math.floor(Math.random()*outfits.length);state.bg=Math.floor(Math.random()*backgrounds.length);for(const k of Object.keys(accessories))state[k]=Math.floor(Math.random()*accessories[k].length);draw();render()};document.querySelector('#reset').onclick=()=>{Object.assign(state,{outfit:0,bg:0,Glasses:0,Hats:0,Bling:0,scale:1,x:0,y:0});draw();render()};document.querySelector('#download').onclick=()=>{c.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meownero-pfp.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png')};render();draw();
</script></body></html>

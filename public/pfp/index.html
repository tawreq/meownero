<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meownero PFP Studio</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17161a;background:#f7f6f3}*{box-sizing:border-box}body{margin:0}header{background:#17161a;color:white;padding:22px max(24px,calc((100vw - 1100px)/2));font-weight:900;font-size:23px}header b{color:#fa691d}main{max-width:1100px;margin:35px auto;padding:0 18px}h1{font-size:clamp(32px,5vw,56px);margin:0 0 6px}p{color:#59575a}main>p{margin-bottom:30px}.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr);gap:30px}.preview{position:sticky;top:20px;align-self:start}canvas#preview{width:100%;aspect-ratio:1;display:block;border:3px solid #17161a;border-radius:18px;box-shadow:8px 8px 0 #17161a;background:#fff}.controls{background:#fff;border:2px solid #17161a;border-radius:18px;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button{cursor:pointer;font:inherit;border:2px solid #17161a;border-radius:10px;padding:10px 12px;background:white;font-weight:700}button.active{background:#fa691d;color:#fff}button.primary{background:#fa691d;color:#fff;width:100%;margin-top:12px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{padding:5px;overflow:hidden;font-size:12px;display:flex;flex-direction:column;gap:5px}.tile img{width:100%;aspect-ratio:1;object-fit:contain;background:#eee;border-radius:6px}.swatch{height:65px;border-radius:6px;border:1px solid #ddd}.label{display:block;margin:14px 0 7px;font-weight:700}input[type=range]{width:100%}.note{font-size:12px}.actions{display:flex;gap:10px}.actions button{flex:1}#notice{font-size:13px}@media(max-width:750px){.studio{grid-template-columns:1fr}.preview{position:static}.controls{padding:13px}}</style></head><body><header>MEOW<b>NERO</b> <small> / PFP STUDIO</small></header><main><h1>MAKE IT YOUR MEOW.</h1><p>Choose a look. Switch the background. Add accessories. Download your PFP.</p><div class="studio"><div class="preview"><canvas id="preview" width="1000" height="1000"></canvas><div class="actions"><button id="random">🎲 Randomise</button><button id="reset">↺ Reset</button></div><button class="primary" id="download">↓ Download PNG · 1000 × 1000</button><p id="notice">Choose from all uploaded jacket designs. Preview branch — main website remains unchanged.</p></div><section class="controls"><div class="tabs" id="tabs"></div><div id="options" class="options"></div><div id="adjust"></div></section></div></main><script>
const c=document.querySelector('#preview'),ctx=c.getContext('2d');const outfits=[{"name":"Base outfit","src":"/pfp/base%20image.png"},{"name":"Glossy puffer","src":"/outfit-puffer.webp"},{"name":"Jacket 01","src":"/pfp/02ab14f0-5f04-4d94-a8a6-fd350bdb27cf.png"},{"name":"Jacket 02","src":"/pfp/05831ca5-67b9-44a1-8b83-af469b448cf2.png"},{"name":"Jacket 03","src":"/pfp/0ef2e446-7ba9-44af-a4ea-6299cfd96ea5.png"},{"name":"Jacket 04","src":"/pfp/11e67fff-05b8-4e4e-8b24-f863809afe42.png"},{"name":"Jacket 05","src":"/pfp/210076d9-40c3-4bf3-b4d5-1d394259b8cd.png"},{"name":"Jacket 06","src":"/pfp/3507840d-c437-438f-a800-20c9dbdfeb21.png"},{"name":"Jacket 07","src":"/pfp/3b29403a-79a2-4a48-81b7-f4d69531af8b.png"},{"name":"Jacket 08","src":"/pfp/3c5a2d52-fa5e-4074-85db-124ff47ec6ec.png"},{"name":"Jacket 09","src":"/pfp/41cf0e10-ea69-4f22-a253-8a9974489b88.png"},{"name":"Jacket 10","src":"/pfp/57eb2fc7-ed77-444b-8511-28c5001fd596.png"},{"name":"Jacket 11","src":"/pfp/5d798fd1-983c-454c-8e95-a0fa432cd296.png"},{"name":"Jacket 12","src":"/pfp/7f443ac6-9d02-4143-9bdf-28b3d959330d.png"},{"name":"Jacket 13","src":"/pfp/7fad99ae-0d2b-4cb2-8a68-3d366f50fbd8.png"},{"name":"Jacket 14","src":"/pfp/96f3de9a-0a29-4f32-a470-9a9ee4ce5e11.png"},{"name":"Jacket 15","src":"/pfp/9794c373-e5aa-44cc-b7e5-ddc1dc71ecb9.png"},{"name":"Jacket 16","src":"/pfp/a0105486-dcb0-49d5-878c-283204b2cdd9.png"},{"name":"Jacket 17","src":"/pfp/afa94f93-0036-463a-b9af-83653df8fc4f.png"},{"name":"Jacket 18","src":"/pfp/b47f9dc7-d6dc-44ad-aa77-f454a8dfc2c7.png"},{"name":"Jacket 19","src":"/pfp/c94a999d-98e5-460d-85f9-fb619fbd6adc.png"},{"name":"Jacket 20","src":"/pfp/dc2a5f9d-fa1d-4ff9-815b-71dbef511b3d.png"},{"name":"Jacket 21","src":"/pfp/e5ce793b-da9f-41d5-abf7-b1d41a466dae.png"},{"name":"Jacket 22","src":"/pfp/e7aab8dc-9118-40bb-88a3-58e43cf44351.png"},{"name":"Jacket 23","src":"/pfp/ee4b8780-9a28-4d0a-8ca6-3abc2fb358f2.png"},{"name":"Jacket 24","src":"/pfp/ef4e34b2-4742-401e-822d-78415a00c96d.png"},{"name":"Jacket 25","src":"/pfp/f242f94b-c13f-45c9-bc1d-00b1e047e353.png"},{"name":"Jacket 26","src":"/pfp/f4deaf15-0938-43fd-ad3d-c890c5552642.png"}];
const backgrounds=[{name:'Original cream',type:'cream'},{name:'Orange',type:'#fa691d'},{name:'Sky blue',type:'#9dc9e9'},{name:'Lilac',type:'#b5a2df'},{name:'Mint',type:'#b8e0c0'},{name:'Black',type:'#17161a'},{name:'Pink',type:'#f3b6c7'},{name:'Yellow',type:'#f8d970'},{name:'Dots',type:'dots'},{name:'Sunburst',type:'burst'}];
const accessories={Glasses:['None','Black shades','Pixel shades'],Hats:['None','Crown','Black cap'],Bling:['None','Gold chain','Silver chain']};const state={outfit:0,bg:0,Glasses:0,Hats:0,Bling:0,scale:1,x:0,y:0};let tab='Outfits';const images=outfits.map(o=>{const i=new Image();i.onload=draw;i.src=o.src;return i});
function background(){const b=backgrounds[state.bg].type;ctx.fillStyle=b==='cream'||b==='dots'?'#f7f6f3':b==='burst'?'#fa691d':b;ctx.fillRect(0,0,1000,1000);if(b==='dots'||b==='cream'){ctx.fillStyle='rgba(23,22,26,.10)';for(let y=20;y<1000;y+=40)for(let x=20;x<1000;x+=40){ctx.beginPath();ctx.arc(x,y,2.3,0,7);ctx.fill()}}if(b==='burst'){ctx.save();ctx.translate(500,500);for(let i=0;i<24;i++){ctx.rotate(Math.PI/12);ctx.fillStyle=i%2?'#fa691d':'#ffb04a';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-100,-900);ctx.lineTo(100,-900);ctx.fill()}ctx.restore()}}
function accessory(){ctx.save();ctx.translate(state.x,state.y);ctx.scale(state.scale,state.scale);if(state.Bling){ctx.strokeStyle=state.Bling===1?'#edbd39':'#cbd3df';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(365,565);ctx.quadraticCurveTo(500,750,635,565);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(500,713,30,0,7);ctx.fill()}if(state.Glasses){ctx.fillStyle='#16161b';if(state.Glasses===1){for(let x of [345,520]){ctx.beginPath();ctx.roundRect(x,297,135,75,17);ctx.fill()}ctx.fillRect(470,310,60,12)}else{for(let x of [340,515])for(let y=298;y<360;y+=16)ctx.fillRect(x,y,135,13);ctx.fillRect(475,312,40,14)}}if(state.Hats){if(state.Hats===1){ctx.fillStyle='#e9b73a';ctx.strokeStyle='#a36a17';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(320,230);ctx.lineTo(320,90);ctx.lineTo(400,150);ctx.lineTo(500,65);ctx.lineTo(600,150);ctx.lineTo(680,90);ctx.lineTo(680,230);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#e33d34';ctx.beginPath();ctx.arc(500,100,18,0,7);ctx.fill()}else{ctx.fillStyle='#1c1b20';ctx.beginPath();ctx.ellipse(500,215,200,115,0,Math.PI,2*Math.PI);ctx.fill();ctx.fillRect(300,202,400,42);ctx.fillStyle='#fa691d';ctx.fillRect(300,239,400,14)}}ctx.restore()}
function draw(){background();const img=images[state.outfit];if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,1000,1000);else if(state.outfit>1){const base=images[0];if(base.complete&&base.naturalWidth)ctx.drawImage(base,0,0,1000,1000)}accessory()}
function render(){const tabs=['Outfits','Backgrounds','Glasses','Hats','Bling'];document.querySelector('#tabs').replaceChildren(...tabs.map(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};return b}));const opts=document.querySelector('#options');opts.replaceChildren();let items=tab==='Outfits'?outfits:tab==='Backgrounds'?backgrounds:accessories[tab].map(name=>({name}));items.forEach((item,i)=>{const b=document.createElement('button');b.className='tile '+((tab==='Outfits'?state.outfit:tab==='Backgrounds'?state.bg:state[tab])===i?'active':'');if(tab==='Outfits'){const img=document.createElement('img');img.src=item.src;img.onerror=()=>{img.src='/ghost.webp';img.onerror=null};b.append(img)}else if(tab==='Backgrounds'){const sw=document.createElement('div');sw.className='swatch';sw.style.background=item.type==='cream'?'#f7f6f3':item.type==='dots'?'radial-gradient(#aaa 1px,#f7f6f3 1px)':item.type==='burst'?'repeating-conic-gradient(#ffb04a 0deg 15deg,#fa691d 15deg 30deg)':item.type;b.append(sw)}const label=document.createElement('span');label.textContent=item.name;b.append(label);b.onclick=()=>{if(tab==='Outfits')state.outfit=i;else if(tab==='Backgrounds')state.bg=i;else state[tab]=i;draw();render()};opts.append(b)});const adj=document.querySelector('#adjust');adj.replaceChildren();if(['Glasses','Hats','Bling'].includes(tab)){for(const [name,key,min,max,step] of [['Size','scale',.6,1.5,.01],['Horizontal','x',-130,130,1],['Vertical','y',-130,130,1]]){const l=document.createElement('label');l.className='label';l.textContent=name;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=state[key];input.oninput=()=>{state[key]=Number(input.value);draw()};adj.append(l,input)}}}
document.querySelector('#random').onclick=()=>{state.outfit=Math.floor(Math.random()*outfits.length);state.bg=Math.floor(Math.random()*backgrounds.length);for(const k of Object.keys(accessories))state[k]=Math.floor(Math.random()*accessories[k].length);draw();render()};document.querySelector('#reset').onclick=()=>{Object.assign(state,{outfit:0,bg:0,Glasses:0,Hats:0,Bling:0,scale:1,x:0,y:0});draw();render()};document.querySelector('#download').onclick=()=>{c.toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meownero-pfp.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png')};render();draw();
</script></body></html>
